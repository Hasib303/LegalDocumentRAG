# NerdFarm — application configuration
# Models, thresholds, paths. Secrets live in .env (see .env.example).

models:
  embedder: BAAI/bge-m3
  reranker: BAAI/bge-reranker-v2-m3
  generator_primary: gemini-2.5-flash-lite
  generator_fallback: groq:qwen-qwq-32b
  vision: gemini-2.5-flash
  context_writer: gemini-2.5-flash       # contextual chunk prepend at index time
  edit_classifier: gemini-2.5-flash

ocr:
  confidence_threshold: 0.80              # below this, fall through to vision LLM
  rasterize_dpi: 300
  rasterize_dpi_degraded: 400

chunking:
  target_tokens: 450
  overlap_tokens: 90
  respect_sections: true
  contextual_prepend: true

retrieval:
  k_dense: 20
  k_sparse: 20
  rrf_k: 60
  rerank_top_n: 8

generation:
  temperature: 0.1
  max_output_tokens: 1500
  require_citations: true
  thinking_budget: 0                      # off for synthesis; toggle on for hard sections

learning:
  terminology_graduation_threshold: 2
  exemplars_per_section: 20
  rule_min_corroborating_edits: 2
  exemplar_decay_days: 90

evaluation:
  held_out_matter_ids: []                 # populated after corpus → matter mapping

paths:
  data_root: ./data
  raw: ./data
  processed: ./data/processed
  chunks: ./data/chunks
  vector_store: ./data/vector_store
  drafts: ./data/drafts
  edits: ./data/edits
  style_memory: ./data/style_memory
  evals: ./data/evals
  logs: ./logs
